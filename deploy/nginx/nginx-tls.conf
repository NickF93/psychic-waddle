worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log crit;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_body_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker embedded DNS follows the API when its container address changes.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream assistant_api {
        zone assistant_api 64k;
        server api:8000 resolve;
    }

    map $http_origin $assistant_cors_origin {
        default "";
        "https://pigreco.xyz" $http_origin;
        "https://www.pigreco.xyz" $http_origin;
    }

    map $http_origin $assistant_origin_rejected {
        default 1;
        "" 0;
        "https://pigreco.xyz" 0;
        "https://www.pigreco.xyz" 0;
    }

    limit_req_zone $binary_remote_addr zone=assistant_chat:10m rate=20r/m;

    # Redact token-bearing paths on redirects and fallback hosts as well as TLS.
    map $uri $assistant_log_path {
        default other;
        /api/assistant/chat /api/assistant/chat;
        /api/assistant/health /api/assistant/health;
        /api/assistant/ready /api/assistant/ready;
    }

    log_format assistant_redacted
        '$time_iso8601 method=$request_method path=$assistant_log_path status=$status '
        'bytes=$body_bytes_sent request_time=$request_time '
        'origin="$assistant_cors_origin"';

    access_log /dev/stdout assistant_redacted;

    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
            access_log off;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/portfolio-rag-assistant/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portfolio-rag-assistant/privkey.pem;
        ssl_session_cache shared:assistant_ssl:10m;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        include /etc/nginx/snippets/assistant-site.conf;

        location / {
            return 404;
        }
    }
    # Optional, operator-provided private service virtual hosts. Empty by default.
    include /etc/nginx/private-services/*.conf;
    # Optional HTTPS sites; opt-in mount supplied by Compose override.
    include /etc/nginx/public-services/*.conf;
}
