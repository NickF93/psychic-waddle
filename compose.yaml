name: portfolio-rag-assistant

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    logging: *bounded-logging
    restart: unless-stopped
    build:
      context: .
    image: portfolio-rag-assistant:local
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CHAT_BACKEND: ${CHAT_BACKEND}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-30}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-384}
      GENERATION_PROFILES_PATH: ${GENERATION_PROFILES_PATH:-}
      CHAT_PARAMETER_PROFILE: ${CHAT_PARAMETER_PROFILE:-}
      CHAT_REASONING_MODE: ${CHAT_REASONING_MODE:-default}
      CHAT_REASONING_EFFORT: ${CHAT_REASONING_EFFORT:-}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-}
      CHAT_TOP_P: ${CHAT_TOP_P:-}
      CHAT_INPUT_MAX_BYTES: ${CHAT_INPUT_MAX_BYTES:-65536}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-}
      CHAT_INPUT_TOKENIZER: ${CHAT_INPUT_TOKENIZER:-}
      CHAT_FALLBACK_BACKEND: ${CHAT_FALLBACK_BACKEND:-}
      CHAT_FALLBACK_BASE_URL: ${CHAT_FALLBACK_BASE_URL:-}
      CHAT_FALLBACK_MODEL: ${CHAT_FALLBACK_MODEL:-}
      CHAT_FALLBACK_API_KEY: ${CHAT_FALLBACK_API_KEY:-}
      CHAT_FALLBACK_TIMEOUT_SECONDS: ${CHAT_FALLBACK_TIMEOUT_SECONDS:-180}
      CHAT_FALLBACK_MAX_TOKENS: ${CHAT_FALLBACK_MAX_TOKENS:-384}
      CHAT_FALLBACK_PARAMETER_PROFILE: ${CHAT_FALLBACK_PARAMETER_PROFILE:-}
      CHAT_FALLBACK_REASONING_MODE: ${CHAT_FALLBACK_REASONING_MODE:-default}
      CHAT_FALLBACK_REASONING_EFFORT: ${CHAT_FALLBACK_REASONING_EFFORT:-}
      CHAT_FALLBACK_TEMPERATURE: ${CHAT_FALLBACK_TEMPERATURE:-}
      CHAT_FALLBACK_TOP_P: ${CHAT_FALLBACK_TOP_P:-}
      CHAT_FALLBACK_INPUT_MAX_BYTES: ${CHAT_FALLBACK_INPUT_MAX_BYTES:-65536}
      CHAT_FALLBACK_CONTEXT_TOKENS: ${CHAT_FALLBACK_CONTEXT_TOKENS:-}
      CHAT_FALLBACK_INPUT_TOKENIZER: ${CHAT_FALLBACK_INPUT_TOKENIZER:-}
      CHAT_REQUEST_TIMEOUT_SECONDS: ${CHAT_REQUEST_TIMEOUT_SECONDS:-240}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K}
      RETRIEVAL_CANDIDATE_FAN_OUT: ${RETRIEVAL_CANDIDATE_FAN_OUT}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE}
      INTENT_PROFILES_PATH: ${INTENT_PROFILES_PATH}
      QUESTION_COLLECTION_ENABLED: ${QUESTION_COLLECTION_ENABLED}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    logging: *bounded-logging
    restart: unless-stopped
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    profiles:
      - public
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_BIND_ADDRESS:?missing PUBLIC_HTTP_BIND_ADDRESS}:${PUBLIC_HTTP_PORT:?missing PUBLIC_HTTP_PORT}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/private-services:/etc/nginx/private-services:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - acme-challenges:/var/www/certbot:ro
    tmpfs:
      - /tmp
    networks:
      - runtime
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/api/assistant/health"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx-tls:
    logging: *bounded-logging
    restart: unless-stopped
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    profiles:
      - public-tls
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_BIND_ADDRESS:?missing PUBLIC_HTTP_BIND_ADDRESS}:${PUBLIC_HTTP_PORT:?missing PUBLIC_HTTP_PORT}:80"
      - "${PUBLIC_HTTPS_BIND_ADDRESS:?missing PUBLIC_HTTPS_BIND_ADDRESS}:${PUBLIC_HTTPS_PORT:?missing PUBLIC_HTTPS_PORT}:443"
    volumes:
      - ./deploy/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/private-services:/etc/nginx/private-services:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - acme-challenges:/var/www/certbot:ro
      - letsencrypt-certs:/etc/letsencrypt:ro
    tmpfs:
      - /tmp
    networks:
      - runtime
    healthcheck:
      test:
        - CMD-SHELL
        - "nginx -t"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  certbot:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/certbot.Dockerfile
    image: portfolio-rag-certbot:local
    profiles:
      - public
      - public-tls
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - letsencrypt-work:/var/lib/letsencrypt
      - acme-challenges:/var/www/certbot
    networks:
      - runtime

  db:
    logging: *bounded-logging
    restart: unless-stopped
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    networks:
      - runtime
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    logging: *bounded-logging
    restart: unless-stopped
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    profiles:
      - ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  llama-cpp-chat:
    logging: *bounded-logging
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:1c2e5802addaaf61684532d828664027b5daaf2e2b29943cf338b7005e4ea9ca
    profiles:
      - llama-cpp
    command:
      - -m
      - ${LLAMA_CPP_CHAT_MODEL_PATH}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - type: bind
        source: ${LLAMA_CPP_MODEL_DIR}
        target: /models
        read_only: true
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 10s

  llama-cpp-embeddings:
    logging: *bounded-logging
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:1c2e5802addaaf61684532d828664027b5daaf2e2b29943cf338b7005e4ea9ca
    profiles:
      - llama-cpp
    command:
      - -m
      - ${LLAMA_CPP_EMBEDDING_MODEL_PATH}
      - --embedding
      - --pooling
      - ${LLAMA_CPP_EMBEDDING_POOLING:-mean}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - type: bind
        source: ${LLAMA_CPP_MODEL_DIR}
        target: /models
        read_only: true
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 10s

networks:
  runtime:
    driver: bridge

volumes:
  postgres-data:
  ollama-models:
  letsencrypt-certs:
  letsencrypt-work:
  acme-challenges:
